name: trading-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BROKER_CREDENTIALS_KEY: ${BROKER_CREDENTIALS_KEY:-}
      TENANT_ID: ${TENANT_ID:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_TERMINAL_PATH: ${MT5_TERMINAL_PATH:-}
      CRYPTO_EXCHANGE: ${CRYPTO_EXCHANGE:-binance}
      CRYPTO_API_KEY: ${CRYPTO_API_KEY:-}
      CRYPTO_API_SECRET: ${CRYPTO_API_SECRET:-}
      CRYPTO_API_PASSWORD: ${CRYPTO_API_PASSWORD:-}
      CRYPTO_SANDBOX: ${CRYPTO_SANDBOX:-true}
      CRYPTO_DEFAULT_TYPE: ${CRYPTO_DEFAULT_TYPE:-spot}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      ENGINE_ENABLED: ${ENGINE_ENABLED:-false}
      ENGINE_SYMBOLS: ${ENGINE_SYMBOLS:-BTC/USDT}
      ENGINE_MT5_SYMBOLS: ${ENGINE_MT5_SYMBOLS:-EURUSD,XAUUSD}
      ENGINE_TIMEFRAME: ${ENGINE_TIMEFRAME:-1m}
      ENGINE_PAPER_MODE: ${ENGINE_PAPER_MODE:-true}
      EXECUTION_MODE: ${EXECUTION_MODE:-semi_auto}
      ENGINE_MAX_DAILY_DRAWDOWN_PCT: ${ENGINE_MAX_DAILY_DRAWDOWN_PCT:-3.0}
      ENGINE_NEWS_BLACKOUT_MINUTES: ${ENGINE_NEWS_BLACKOUT_MINUTES:-15}
      PAPER_ACCOUNT_EQUITY: ${PAPER_ACCOUNT_EQUITY:-10000}
      NEWS_EVENTS_JSON: ${NEWS_EVENTS_JSON:-[]}
      NEWS_CALENDAR_API_KEY: ${NEWS_CALENDAR_API_KEY:-}
      NEWS_CALENDAR_POLL_SECONDS: ${NEWS_CALENDAR_POLL_SECONDS:-900}
      NEWS_CALENDAR_REQUIRED: ${NEWS_CALENDAR_REQUIRED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_ROLE: publisher
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-UTC}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:admin@example.com}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  telegram-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.telegram_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      BROKER_CREDENTIALS_KEY: ${BROKER_CREDENTIALS_KEY:-}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      ENGINE_PAPER_MODE: ${ENGINE_PAPER_MODE:-true}
      TENANT_ID: ${TENANT_ID:-local}
      NEWS_CALENDAR_API_KEY: ${NEWS_CALENDAR_API_KEY:-}
      NEWS_CALENDAR_POLL_SECONDS: ${NEWS_CALENDAR_POLL_SECONDS:-900}
      NEWS_CALENDAR_REQUIRED: ${NEWS_CALENDAR_REQUIRED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_ROLE: worker
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-UTC}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:admin@example.com}
      ENGINE_MAX_DAILY_DRAWDOWN_PCT: ${ENGINE_MAX_DAILY_DRAWDOWN_PCT:-3.0}
      ENGINE_NEWS_BLACKOUT_MINUTES: ${ENGINE_NEWS_BLACKOUT_MINUTES:-15}
      PAPER_ACCOUNT_EQUITY: ${PAPER_ACCOUNT_EQUITY:-10000}
      NEWS_EVENTS_JSON: ${NEWS_EVENTS_JSON:-[]}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
